name: Deploy to Google Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: play-store-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Versions
        run: |
          flutter --version
          java -version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Prepare Production Environment
        run: |
          echo "ENV=prod" > .env

      - name: Set up Android Keystore & key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.PLAY_STORE_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.PLAY_STORE_KEY_PASSWORD || 'foamMobileSecureUploadKey2026' }}
          STORE_PASSWORD: ${{ secrets.PLAY_STORE_STORE_PASSWORD || 'foamMobileSecureUploadKey2026' }}
        run: |
          # If the secret is set, decode it; otherwise use repository keystore if present
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          fi

          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Determine Version & Dynamic Build Number
        id: versioning
        run: |
          # Increment build number from base 10 with GitHub run number to guarantee strictly incrementing versionCode
          BUILD_NUMBER=$((10 + GITHUB_RUN_NUMBER))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Target versionCode (build number): $BUILD_NUMBER"

      - name: Build Android App Bundle (.aab)
        run: |
          flutter build appbundle --release --build-number=${{ steps.versioning.outputs.build_number }}

      - name: Upload Build Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: playstore-bundle-${{ steps.versioning.outputs.build_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Publish to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.foam.foam_mobile
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          status: 'completed'
